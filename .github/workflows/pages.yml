name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le modele GGUF (415 Mo) n'est pas deploye : il vient de Hugging Face.
      # On ne publie que les fichiers de l'application.
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r index.html styles.css manifest.webmanifest sw.js icons src vendor dist/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
